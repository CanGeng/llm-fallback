# llm-fallback profile layer: insert one row that mounts the fallback plugin.
# The first provider of each pool is the primary; later ones are fallbacks,
# tried in order. An explicit provider that is a pool member starts there and
# fails over forward from it.
- insert:
    - id: llm-fallback
      name: 'llm-fallback'
      config:
        alwaysPolicy: reject     # reject = refuse to load on `always`; degrade = cap it and warn
        alwaysMaxRetries: 2      # when degrade, max same-provider retries before failing over
        pools:
          - model: deepseek-v4-pro
            providers:
              - deepseek-official
              - ark-coding
              - ark-agent
          - model: deepseek-v4-flash
            providers:
              - deepseek-official
              - ark-coding
              - ark-agent
          # deepseek-official does not serve the GLM models, so they start at
          # ark-coding and fall back to ark-agent only.
          - model: glm-5.3
            providers:
              - ark-coding
              - ark-agent
          - model: glm-5.2
            providers:
              - ark-coding
              - ark-agent
